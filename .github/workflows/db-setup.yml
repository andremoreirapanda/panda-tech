name: Configurar banco de dados (Supabase)

# Workflow manual (nao roda automaticamente). Use para aplicar o schema
# no Postgres do Supabase e popular os dados iniciais (planos comerciais +
# conta admin_master). So precisa rodar uma vez, ou de novo se o schema
# mudar.
on:
  workflow_dispatch: {}

jobs:
  setup-db:
    name: Aplicar schema e seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Testar conexao
        run: psql "$DATABASE_URL" -c "select version();"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Aplicar schema_postgres.sql
        # continue-on-error: o schema já foi aplicado antes (tabelas existentes
        # geram erro "already exists"), mas o script de seed abaixo é idempotente
        # e não depende deste passo ter sucesso numa reexecução.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/schema_postgres.sql
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Aplicar migração incremental (integrações da plataforma)
        # Script à parte, com CREATE TABLE IF NOT EXISTS — roda mesmo quando o
        # passo acima falhou cedo (banco já tinha as tabelas originais) e
        # continua seguro em reexecuções futuras.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migracao_integracoes_plataforma.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Popular dados iniciais (planos + admin_master)
        run: python seed_producao.py
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}
          ADMIN_NOME: "Administrador"
