name: Configurar banco de dados (Supabase)

# Workflow manual (nao roda automaticamente). Use para aplicar o schema
# no Postgres do Supabase e popular os dados iniciais (planos comerciais +
# conta admin_master). So precisa rodar uma vez, ou de novo se o schema
# mudar.
on:
  workflow_dispatch: {}

# CodeQL: "Workflow does not contain permissions" - este workflow so le o
# repositorio (checkout) e usa secrets para falar com o Supabase; nunca
# escreve nada de volta no GitHub, entao o GITHUB_TOKEN nao precisa de
# nenhuma permissao alem de checkout.
permissions:
  contents: read

jobs:
  setup-db:
    name: Aplicar schema e seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Testar conexao
        run: psql "$DATABASE_URL" -c "select version();"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Aplicar schema_postgres.sql
        # continue-on-error: o schema já foi aplicado antes (tabelas existentes
        # geram erro "already exists"), mas o script de seed abaixo é idempotente
        # e não depende deste passo ter sucesso numa reexecução.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/schema_postgres.sql
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Aplicar migração incremental (integrações da plataforma)
        # Script à parte, com CREATE TABLE IF NOT EXISTS — roda mesmo quando o
        # passo acima falhou cedo (banco já tinha as tabelas originais) e
        # continua seguro em reexecuções futuras.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migracao_integracoes_plataforma.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Aplicar migração incremental (frequência configurável de missão)
        # ADD COLUMN IF NOT EXISTS — idempotente, mesmo padrão do passo acima.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migracao_frequencia_missao.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Aplicar migração incremental (forma de pagamento cartão)
        # DROP CONSTRAINT IF EXISTS + ADD CONSTRAINT — idempotente, mesmo
        # padrão dos passos acima.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migracao_forma_pagamento_cartao.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Aplicar migração incremental (gestor atuar como profissional)
        # ADD COLUMN IF NOT EXISTS — idempotente, mesmo padrão dos passos acima.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migracao_atuar_como_profissional.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Popular dados iniciais (planos + admin_master)
        # ENCANTO_CRYPTO_KEY e ENCANTO_SECRET: seed_producao.py não cifra dados
        # nem assina token nenhum diretamente, mas ele importa `auth.py`
        # (ENCANTO_SECRET, assinatura de JWT) e, via `db.py`, `crypto_utils.py`
        # (ENCANTO_CRYPTO_KEY, cifra de credenciais de integração) — os dois
        # módulos recusam inicializar (RuntimeError) sem a respectiva variável
        # definida, fora do modo de desenvolvimento (correção de auditoria).
        # Só precisam existir aqui pro import não quebrar: este workflow nunca
        # assina/verifica token nem cifra/decifra nada de verdade, então podem
        # ser valores só do CI, independentes das chaves reais de produção no
        # cPanel.
        run: python seed_producao.py
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}
          ADMIN_NOME: "Administrador"
          ENCANTO_CRYPTO_KEY: ${{ secrets.ENCANTO_CRYPTO_KEY }}
          ENCANTO_SECRET: ${{ secrets.ENCANTO_SECRET }}
