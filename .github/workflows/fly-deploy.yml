name: Deploy para o Fly.io

# Todo push na branch principal builda a imagem Docker e faz o deploy
# automaticamente — não precisa rodar `flyctl deploy` manualmente depois da
# configuração inicial.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Diagnostico e criacao do app no Fly.io
        run: |
          echo "== flyctl version =="
          flyctl version
          echo "== flyctl orgs list =="
          flyctl orgs list || true
          echo "== flyctl apps create (tentativa 1: --org andre-moreira-754) =="
          flyctl apps create pandatech1 --org andre-moreira-754 || true
          echo "== flyctl apps list =="
          flyctl apps list || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
