name: Deploy para o Fly.io

# Todo push na branch principal builda a imagem Docker e faz o deploy
# automaticamente — não precisa rodar `flyctl deploy` manualmente depois da
# configuração inicial.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Garantir que o app existe no Fly.io
        run: flyctl apps create pandatech1 --org personal || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
